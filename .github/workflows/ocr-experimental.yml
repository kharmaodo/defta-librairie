name: Experimental OCR core

on:
  pull_request:
    paths:
      - 'services/ocr-experimental/**'
      - 'internal/ocr/**'
      - 'internal/config/**'
      - 'internal/services/cover_import_ocr*'
      - 'internal/repositories/cover_import_ocr*'
      - 'cmd/cover_import_ocr*'
      - '.github/workflows/ocr-experimental.yml'
  push:
    branches: [develop]
    paths:
      - 'services/ocr-experimental/**'
      - 'internal/ocr/**'
      - 'internal/config/**'
      - 'internal/services/cover_import_ocr*'
      - 'internal/repositories/cover_import_ocr*'
      - 'cmd/cover_import_ocr*'
      - '.github/workflows/ocr-experimental.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/ocr-experimental/requirements*.txt
      - name: Install local OCR prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ara fonts-dejavu-core
          python -m pip install -r services/ocr-experimental/requirements-dev.txt
      - name: Check Python
        working-directory: services/ocr-experimental
        run: |
          python -m ruff check .
          python -m mypy --strict .
          python -m unittest discover -s tests -v
      - name: Build and verify isolated CPU container
        run: |
          CGO_ENABLED=0 go test -c -o "$RUNNER_TEMP/ocr-adapter.test" ./internal/ocr
          OCR_ADAPTER_TEST_BINARY="$RUNNER_TEMP/ocr-adapter.test" sh services/ocr-experimental/check-container.sh
      - run: git diff --check
