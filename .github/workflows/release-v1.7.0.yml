name: Release v1.7.0 gate

on:
  push:
    branches:
      - feature/v1.7.0-us-1707-retention-gate
  pull_request:
    paths:
      - 'internal/migrations/**'
      - 'internal/repositories/cover_import_retention*'
      - 'internal/repositories/cover_cleanup*'
      - 'internal/repositories/cover_import_hold*'
      - 'internal/services/cover_import_retention*'
      - 'internal/handlers/cover_import_retention*'
      - 'static/openapi.json'
      - 'cmd/main.go'
      - 'cmd/cover_cleanup_runtime.go'
      - 'scripts/check-release-v1.7.0.sh'
      - '.github/workflows/release-v1.7.0.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sh scripts/check-release-v1.7.0.sh
      - name: Generate temporary Docker credentials
        run: |
          echo "MINIO_ACCESS_KEY=ci$(openssl rand -hex 8)" >> "$GITHUB_ENV"
          echo "MINIO_SECRET_KEY=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "NATS_USER=ci$(openssl rand -hex 8)" >> "$GITHUB_ENV"
          echo "NATS_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: Start MinIO and JetStream
        run: |
          docker compose -f deploy/docker-compose.covers.yml up -d --wait minio nats
          docker compose -f deploy/docker-compose.covers.yml run --rm minio-init
      - name: Integration tests against Docker services
        env:
          NATS_INTEGRATION: '1'
          MINIO_INTEGRATION: '1'
          COVER_PIPELINE_INTEGRATION: '1'
        run: go test -count=1 -tags fts5 ./internal/covers ./internal/services
      - name: Stop Docker services
        if: always()
        run: docker compose -f deploy/docker-compose.covers.yml down --volumes
