name: Release v1.7.0 gate

on:
  push:
    branches:
      - feature/v1.7.0-us-1707-retention-gate
  pull_request:
    paths:
      - 'internal/migrations/**'
      - 'internal/repositories/cover_import_retention*'
      - 'internal/repositories/cover_cleanup*'
      - 'internal/repositories/cover_import_hold*'
      - 'internal/services/cover_import_retention*'
      - 'internal/handlers/cover_import_retention*'
      - 'static/openapi.json'
      - 'cmd/main.go'
      - 'deploy/docker-compose.ci.yml'
      - 'cmd/cover_cleanup_runtime.go'
      - 'scripts/check-release-v1.7.0.sh'
      - '.github/workflows/release-v1.7.0.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sh scripts/check-release-v1.7.0.sh
      - name: Generate temporary Docker credentials
        run: |
          echo "MINIO_ACCESS_KEY=ci$(openssl rand -hex 8)" >> "$GITHUB_ENV"
          echo "MINIO_SECRET_KEY=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "NATS_USER=ci$(openssl rand -hex 8)" >> "$GITHUB_ENV"
          echo "NATS_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: Start MinIO and JetStream
        run: |
          docker compose -f deploy/docker-compose.covers.yml -f deploy/docker-compose.ci.yml up -d minio nats
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null &&
               curl --fail --silent http://127.0.0.1:8222/healthz >/dev/null; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:9000/minio/health/live
          curl --fail http://127.0.0.1:8222/healthz
          export MC_HOST_ci="http://${MINIO_ACCESS_KEY}:${MINIO_SECRET_KEY}@127.0.0.1:9000"
          docker run --rm --network host -e MC_HOST_ci cgr.dev/chainguard/minio-client:latest mb --ignore-existing ci/book-covers
          docker run --rm --network host -e MC_HOST_ci cgr.dev/chainguard/minio-client:latest anonymous set none ci/book-covers
      - name: Integration tests against Docker services
        env:
          NATS_INTEGRATION: '1'
          MINIO_INTEGRATION: '1'
          COVER_PIPELINE_INTEGRATION: '1'
        run: go test -count=1 -tags fts5 ./internal/covers ./internal/services
      - name: Stop Docker services
        if: always()
        run: docker compose -f deploy/docker-compose.covers.yml -f deploy/docker-compose.ci.yml down --volumes
