name: Release v1.7.2 gate

on:
  workflow_dispatch:
  push:
    branches:
      - develop
  pull_request:
    paths:
      - 'internal/**'
      - 'cmd/**'
      - 'services/ocr-experimental/**'
      - 'frontend/**'
      - 'tests/**'
      - 'templates/**'
      - 'static/**'
      - 'go.mod'
      - 'go.sum'
      - 'package*.json'
      - 'deploy/**'
      - '.env.example'
      - 'scripts/**'
      - '.github/workflows/release-v1.7.2.yml'
      - '.github/workflows/security-audit.yml'
      - 'BACKLOG.md'
      - 'CHANGELOG.md'
      - 'docs/RELEASE_V1_7_2.md'
      - 'docs/SECURITY*.md'
      - '.github/workflows/release-binaries.yml'
      - '.github/workflows/cover-worker-image.yml'
      - '.github/workflows/ocr-experimental.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/ocr-experimental/requirements*.txt
      - name: Install local OCR prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ara fonts-dejavu-core
          python -m pip install -r services/ocr-experimental/requirements-dev.txt
      - name: Install pinned security analyzers
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sh scripts/check-release-v1.7.2.sh
      - name: Generate temporary Docker credentials
        id: docker_credentials
        run: |
          for name in MINIO_ACCESS_KEY MINIO_SECRET_KEY NATS_USER NATS_PASSWORD; do
            case "$name" in
              MINIO_ACCESS_KEY|NATS_USER) value="ci$(openssl rand -hex 8)" ;;
              *) value="$(openssl rand -hex 24)" ;;
            esac
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Start MinIO and JetStream
        run: |
          docker compose -f deploy/docker-compose.covers.yml up -d minio nats
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null &&
               curl --fail --silent http://127.0.0.1:8222/healthz >/dev/null; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:9000/minio/health/live
          curl --fail http://127.0.0.1:8222/healthz
          export MC_HOST_ci="http://${MINIO_ACCESS_KEY}:${MINIO_SECRET_KEY}@127.0.0.1:9000"
          docker run --rm --network host -e MC_HOST_ci cgr.dev/chainguard/minio-client@sha256:be51ef820151a708a8e140037e3746862a8c1dd5e624f84b404a1d71bcefb167 mb --ignore-existing ci/book-covers
          docker run --rm --network host -e MC_HOST_ci cgr.dev/chainguard/minio-client@sha256:be51ef820151a708a8e140037e3746862a8c1dd5e624f84b404a1d71bcefb167 anonymous set none ci/book-covers
      - name: Integration tests against Docker services
        env:
          NATS_INTEGRATION: '1'
          MINIO_INTEGRATION: '1'
          COVER_PIPELINE_INTEGRATION: '1'
        run: go test -count=1 -tags fts5 ./internal/covers ./internal/services
      - name: Stop Docker services
        if: always() && steps.docker_credentials.outcome == 'success'
        run: docker compose -f deploy/docker-compose.covers.yml down --volumes

  packages:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install cross-compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 zip
      - name: Build candidate archives without publication
        run: bash scripts/build-release-packages.sh 1.7.2
      - name: Verify both candidate archives
        run: |
          python3 scripts/check-release-packages.py --version 1.7.2 \
            --commit "$(git rev-parse HEAD)" dist/*.zip dist/*.tar.gz
          (cd dist && sha256sum -c SHA256SUMS)
