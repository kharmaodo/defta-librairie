name: Build book cover worker image

on:
  pull_request:
    paths:
      - "cmd/cover-worker/**"
      - "internal/covers/**"
      - "internal/coverruntime/**"
      - "internal/services/book_cover_worker.go"
      - "internal/services/cover_variant_processor.go"
      - "deploy/Dockerfile.cover-worker"
      - ".dockerignore"
      - ".github/workflows/cover-worker-image.yml"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, commit or existing tag to build
        required: true
        default: develop
      publish:
        description: Publish the image to GHCR
        required: true
        type: boolean
        default: false
      image_tag:
        description: Image tag used when publishing
        required: true
        default: edge
  push:
    tags:
      - "v1.6.*"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/defta-cover-worker
      IMAGE_TAG: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || inputs.image_tag || github.ref_name }}

    steps:
      - name: Check out the requested source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Verify a pushed release tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          case "$IMAGE_TAG" in
            v1.6.*) ;;
            *) echo "Tag invalide: $IMAGE_TAG" >&2; exit 1 ;;
          esac
          test "$(git describe --tags --exact-match)" = "$IMAGE_TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' || inputs.publish == true
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the Linux AMD64 worker and publish on demand
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.cover-worker
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true) }}
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:1.6
