name: Release cross-platform binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        default: v1.4.0

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install cross-compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-mingw-w64-x86-64 \
            zip

      - name: Verify the tag
        run: |
          test "$(git describe --tags --exact-match)" = "$RELEASE_TAG"
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Tag invalide: $RELEASE_TAG" >&2; exit 1 ;;
          esac

      - name: Build and package executables
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          build_date="$(date -u +%Y-%m-%d)"
          staging="$(mktemp -d)"
          trap 'rm -rf "$staging"' EXIT
          mkdir -p dist

          package_windows() {
            local name="defta-librairie-${version}-windows-amd64"
            mkdir -p "$staging/$name"
            CGO_ENABLED=1 GOOS=windows GOARCH=amd64 \
              CC=x86_64-w64-mingw32-gcc \
              go build -trimpath -tags fts5 -ldflags="-s -w" \
                -o "$staging/$name/defta-librairie.exe" ./cmd
            cp -R templates static .env.example README.md "$staging/$name/"
            (cd "$staging" && zip -qr "$GITHUB_WORKSPACE/dist/$name.zip" "$name")
          }

          package_linux_amd64() {
            local name="defta-librairie-${version}-linux-amd64"
            mkdir -p "$staging/$name"
            CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
              go build -trimpath -tags fts5 -ldflags="-s -w" \
                -o "$staging/$name/defta-librairie" ./cmd
            cp -R templates static .env.example README.md "$staging/$name/"
            tar -C "$staging" -czf "dist/$name.tar.gz" "$name"
          }

          package_windows
          package_linux_amd64

          printf 'VERSION=%s\nBUILD_DATE=%s\n' "$version" "$build_date" > dist/BUILD-INFO.txt
          (cd dist && sha256sum *.zip *.tar.gz > SHA256SUMS)
          file "$staging"/*/defta-librairie*

      - name: Create or update the GitHub release
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag \
              --title "Defta Librairie ${RELEASE_TAG#v}" \
              --generate-notes
          fi
          gh release upload "$RELEASE_TAG" \
            dist/*.zip dist/*.tar.gz dist/SHA256SUMS dist/BUILD-INFO.txt \
            --clobber
