name: Release cross-platform binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        default: v1.7.2

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install cross-compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-mingw-w64-x86-64 \
            zip

      - name: Verify the tag
        run: |
          test "$(git describe --tags --exact-match)" = "$RELEASE_TAG"
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Tag invalide: $RELEASE_TAG" >&2; exit 1 ;;
          esac

      - name: Build and package executables
        shell: bash
        run: |
          bash scripts/build-release-packages.sh "${RELEASE_TAG#v}"

      - name: Verify archive contents and compiled Go version
        run: |
          python3 scripts/check-release-packages.py --version "${RELEASE_TAG#v}" \
            --commit "$(git rev-parse HEAD)" dist/*.zip dist/*.tar.gz
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Create the GitHub release or upload missing assets
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag \
              --title "Defta Librairie ${RELEASE_TAG#v}" \
              --generate-notes
          fi
          gh release upload "$RELEASE_TAG" \
            dist/*.zip dist/*.tar.gz dist/SHA256SUMS dist/BUILD-INFO.txt
