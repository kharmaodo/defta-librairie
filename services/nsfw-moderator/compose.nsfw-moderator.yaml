services:
  nsfw-moderator:
    build:
      context: ./services/nsfw-moderator
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "10001:10001"
    environment:
      NSFW_MODEL_PATH: /models/model.onnx
      NSFW_MODEL_MANIFEST_PATH: /models/model-manifest.json
      NSFW_MAX_IMAGE_BYTES: "5242880"
    volumes:
      - /opt/models/nsfw:/models:ro
    expose:
      - "8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health/ready', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
