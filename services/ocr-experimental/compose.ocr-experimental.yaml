services:
  ocr-experimental:
    build:
      context: .
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "10001:10001"
    mem_limit: 1g
    cpus: 2
    pids_limit: 64
    environment:
      OCR_SERVICE_TIMEOUT_SECONDS: ${OCR_SERVICE_TIMEOUT_SECONDS:-30}
      OCR_SERVICE_MAX_IMAGE_BYTES: ${OCR_SERVICE_MAX_IMAGE_BYTES:-10485760}
      OCR_SERVICE_MAX_PIXELS: ${OCR_SERVICE_MAX_PIXELS:-24000000}
      OCR_SERVICE_MAX_DIMENSION: ${OCR_SERVICE_MAX_DIMENSION:-10000}
      OCR_SERVICE_MAX_OUTPUT_BYTES: ${OCR_SERVICE_MAX_OUTPUT_BYTES:-1048576}
      OCR_SERVICE_UPLOAD_TIMEOUT_SECONDS: ${OCR_SERVICE_UPLOAD_TIMEOUT_SECONDS:-15}
      OCR_SERVICE_CONCURRENCY: ${OCR_SERVICE_CONCURRENCY:-1}
    expose:
      - "8091"
    networks:
      - ocr-private
networks:
  ocr-private:
    internal: true
