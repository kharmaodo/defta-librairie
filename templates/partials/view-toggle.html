<div class="view-toggle">
  <span>{{GetMsg .Lang "view_label"}} :</span>
  <button type="button" class="view-btn {{if eq .View "card"}}active{{end}}" data-view="card">
    {{GetMsg .Lang "view_cards"}}
  </button>
  <button type="button" class="view-btn {{if eq .View "table"}}active{{end}}" data-view="table">
    {{GetMsg .Lang "view_table"}}
  </button>
</div>
