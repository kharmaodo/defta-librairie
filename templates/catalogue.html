{{define "content"}}

    <div class="search-container">
        <form id="search-form" class="search-form">
            <input 
                type="search" 
                id="search-input" 
                placeholder="{{GetMsg .Lang "search_placeholder"}}" 
                autocomplete="off"
                dir="rtl">
            <button type="submit" id="search-btn">{{GetMsg .Lang "search_button"}}</button>
            <span class="help-icon" title="{{GetMsg .Lang "tooltip_help"}}">؟</span>
        </form>
    </div>

    <div class="view-toggle">
        <span>{{GetMsg .Lang "view_label"}} :</span>
        <button type="button" class="view-btn active" data-view="table">{{GetMsg .Lang "view_table"}}</button>
        <button type="button" class="view-btn" data-view="card">{{GetMsg .Lang "view_cards"}}</button>
    </div>

    <div id="results-container" data-page-size="{{.PageSize}}">
        <div id="books-list" class="books-grid"></div>
        <div id="loading" style="text-align:center; padding:2rem; display:none;">
            جاري التحميل...
        </div>
        <div id="no-more" style="text-align:center; padding:2rem; display:none;">
            لا توجد نتائج إضافية
        </div>
    </div>

{{end}}
