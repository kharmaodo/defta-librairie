<!DOCTYPE html>
<html lang="{{.Lang | default "ar"}}" {{if eq (.Lang | default "ar") "ar"}}dir="rtl"{{end}}>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>   <!-- on gère la valeur par défaut dans le handler -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <h1>{{.Title}}</h1>
    </header>
    <main>
        {{block "content" .}}{{end}}
    </main>
    <footer>
        <p>جميع الحقوق محفوظة © 2025-2026</p>
        <p>{{GetMsg .Lang "footer_version"}} : {{.Version}} – آخر تحديث : {{.BuildDate}}</p>
    </footer>
    <script src="/static/js/main.js" defer></script>
</body>
</html>
